<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GMEmprestimo" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Formulário completo para cadastro de clientes com busca automática de CEP e gestão GM-Empréstimo." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="GM-Empréstimo" />
    <meta property="og:description" content="Formulário completo para cadastro de clientes com busca automática de CEP." />
    <meta property="og:type" content="website" />
    <title>GM-Empréstimo</title>
  </head>
  <body>
    <div id="root">
      <div id="gm-boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;color:#0f172a;">
        <div style="width:56px;height:56px;border-radius:16px;background:#0f172a;color:#eab308;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:-1px;margin-bottom:16px;box-shadow:0 8px 20px rgba(15,23,42,0.12);">GM</div>
        <div id="gm-boot-spinner" style="width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#eab308;border-radius:50%;animation:gm-spin 0.8s linear infinite;margin-bottom:12px;"></div>
        <p id="gm-boot-title" style="margin:0;font-size:16px;font-weight:700;color:#1e293b;">Carregando GM-Empréstimo...</p>
        <p id="gm-boot-subtitle" style="margin:6px 0 0;font-size:13px;color:#64748b;max-width:320px;">Preparando o painel para o seu telefone.</p>
        <button id="gm-boot-retry" type="button" onclick="window.__gmHardReload && window.__gmHardReload()" style="display:none;margin-top:16px;padding:12px 20px;border:none;border-radius:12px;background:#eab308;color:#0f172a;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(234,179,8,0.28);">Atualizar e Tentar Novamente</button>
        <style>@keyframes gm-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      (function () {
        window.__gmHardReload = function () {
          try {
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              }).catch(function () {});
            }
            if ("caches" in window) {
              caches.keys().then(function (keys) {
                for (var i = 0; i < keys.length; i++) {
                  caches.delete(keys[i]);
                }
              }).catch(function () {});
            }
          } catch (e) {}
          setTimeout(function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set("_r", String(Date.now()));
              window.location.replace(u.toString());
            } catch (e) {
              window.location.reload();
            }
          }, 250);
        };

        var showRetry = function (msg) {
          var loader = document.getElementById("gm-boot-loader");
          if (!loader) return;
          var title = document.getElementById("gm-boot-title");
          var sub = document.getElementById("gm-boot-subtitle");
          var btn = document.getElementById("gm-boot-retry");
          var spin = document.getElementById("gm-boot-spinner");
          if (title) title.textContent = "A página demorou para carregar";
          if (sub) sub.textContent = msg || "Toque no botão abaixo para limpar o cache e abrir novamente.";
          if (btn) btn.style.display = "inline-block";
          if (spin) spin.style.display = "none";
        };

        window.addEventListener("error", function (ev) {
          var target = ev && ev.target;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
            showRetry("Falha ao carregar um arquivo da página. Toque abaixo para atualizar.");
          }
        }, true);

        setTimeout(function () {
          if (document.getElementById("gm-boot-loader")) {
            showRetry("Sua conexão pode estar instável ou com cache antigo. Toque no botão abaixo para tentar novamente.");
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
